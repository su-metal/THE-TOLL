<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>

<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .glass-panel {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(24px);
        border: 1px solid rgba(255, 255, 255, 0.4);
      }
      .bg-ethereal-gradient {
        background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-surface font-body text-on-surface antialiased min-h-screen">
<!-- TopAppBar Navigation Shell -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-8 py-4 bg-white/70 dark:bg-slate-900/70 backdrop-blur-3xl no-border bg-surface-container-low/50">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full overflow-hidden bg-surface-container-high flex items-center justify-center">
<img class="w-full h-full object-cover" data-alt="User profile avatar close up" src="https://lh3.googleusercontent.com/aida-public/AB6AXuABod35XX1qIu1ZzEOL_Sxq1uHI2TR_yrYJUIIJj2Wt6IHwdi_RYckW5TsjCeE75457vC-Tmn43JUcYMvwaBcVUi8TSnmJeMC5kfHN5xt2Jqnwowwww4Y4o7DmZilb8Hh0OcqqovCfK_Usiip1SAEf-5rcRWvz0bJIlu9fPDARhIKQy10q2aQFKaEKtfG_o7_KrHLEi2OxqlpscFAWAOnnF1IQSCOKZw481f5QJUGvd14ZiVqiiLREPfQyx3yWFLG_Ol3TRxGLk1I0"/>
</div>
<div class="hidden md:block">
<p class="text-[10px] font-label tracking-widest text-on-surface-variant uppercase">Member</p>
<p class="text-xs font-bold font-headline">user@example.com</p>
</div>
</div>
<div class="text-xl tracking-[0.2em] font-black bg-gradient-to-br from-[#6a11cb] to-[#2575fc] bg-clip-text text-transparent font-headline">
            THE TOLL
        </div>
<div class="flex items-center gap-6">
<div class="flex bg-surface-container rounded-full p-1 text-[10px] font-label font-bold">
<button class="px-3 py-1 rounded-full bg-white shadow-sm text-primary">EN</button>
<button class="px-3 py-1 rounded-full text-on-surface-variant">JP</button>
</div>
<button class="material-symbols-outlined text-indigo-600 dark:text-indigo-400 hover:opacity-80 transition-opacity active:scale-90" data-icon="settings">settings</button>
</div>
</header>
<main class="pt-32 px-6 max-w-2xl mx-auto space-y-12 pb-12">
<!-- Membership & Identity Section -->
<section class="flex flex-col items-start space-y-2">
<div class="inline-flex items-center px-4 py-1.5 rounded-full bg-ethereal-gradient shadow-lg">
<span class="material-symbols-outlined text-white text-[14px] mr-2" style="font-variation-settings: 'FILL' 1;">military_tech</span>
<span class="text-[10px] font-label font-black tracking-[0.15em] text-white">PRO / ACTIVE</span>
</div>
<h1 class="text-4xl md:text-5xl font-black font-headline tracking-tight mt-4">Session Entry</h1>
<p class="text-on-surface-variant max-w-sm font-medium leading-relaxed">Enter your station ID to begin your ethereal focus session.</p>
</section>
<!-- Session Input Section -->
<section class="space-y-6">
<div class="glass-panel p-6 rounded-lg shadow-[0_24px_48px_rgba(25,28,32,0.06)] relative overflow-hidden">
<div class="absolute top-0 right-0 w-32 h-32 bg-primary/5 rounded-full -mr-16 -mt-16 blur-3xl"></div>
<label class="block text-[10px] font-label tracking-[0.2em] text-on-surface-variant mb-4 uppercase">Session Identifier</label>
<div class="flex items-center gap-3">
<div class="flex-1 bg-surface-container-high rounded-lg flex items-center px-6 py-4 transition-all focus-within:ring-2 focus-within:ring-primary/20">
<input class="bg-transparent border-none p-0 focus:ring-0 w-full text-xl font-headline font-bold tracking-widest placeholder:text-outline/40 uppercase" maxlength="9" placeholder="ABCD-1234" type="text"/>
</div>
<button class="w-14 h-14 rounded-lg bg-surface-container-lowest flex items-center justify-center text-primary shadow-sm active:scale-95 transition-transform">
<span class="material-symbols-outlined" data-icon="qr_code_scanner">qr_code_scanner</span>
</button>
</div>
</div>
</section>
<!-- Exercise Selector Section -->
<section class="space-y-6">
<div class="flex justify-between items-end">
<h3 class="text-[10px] font-label tracking-[0.2em] text-on-surface-variant uppercase">Select Modality</h3>
<span class="text-[10px] font-label text-primary font-bold">4 AVAILABLE</span>
</div>
<div class="flex gap-3 overflow-x-auto pb-4 no-scrollbar">
<!-- Auto Tab -->
<button class="flex-shrink-0 px-6 py-4 rounded-lg bg-surface-container-low text-on-surface-variant font-label font-bold text-xs flex items-center gap-2 hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined text-lg" data-icon="auto_awesome">auto_awesome</span>
                    AUTO
                </button>
<!-- Squat Tab (Active) -->
<button class="flex-shrink-0 px-8 py-4 rounded-lg bg-ethereal-gradient text-white font-label font-bold text-xs flex items-center gap-2 shadow-lg">
<span class="material-symbols-outlined text-lg" data-icon="fitness_center">fitness_center</span>
                    SQUAT
                </button>
<!-- Push-up Tab (Locked) -->
<button class="flex-shrink-0 px-6 py-4 rounded-lg bg-surface-container-high text-outline/50 font-label font-bold text-xs flex items-center gap-2 cursor-not-allowed">
<span class="material-symbols-outlined text-lg" data-icon="lock" style="font-variation-settings: 'FILL' 1;">lock</span>
                    PUSH-UP
                </button>
<!-- Sit-up Tab (Locked) -->
<button class="flex-shrink-0 px-6 py-4 rounded-lg bg-surface-container-high text-outline/50 font-label font-bold text-xs flex items-center gap-2 cursor-not-allowed">
<span class="material-symbols-outlined text-lg" data-icon="lock" style="font-variation-settings: 'FILL' 1;">lock</span>
                    SIT-UP
                </button>
</div>
</section>
<!-- Next Exercise Card (Asymmetric Layout) -->
<section>
<div class="flex gap-6">
<div class="flex-1 glass-panel rounded-lg p-8 flex items-center justify-between group overflow-hidden relative">
<div class="relative z-10">
<p class="text-[10px] font-label tracking-widest text-primary font-black mb-2 uppercase">Current Target</p>
<h2 class="text-3xl font-black font-headline">NEXT: 15 SQUATS</h2>
</div>
<div class="w-16 h-16 rounded-full bg-primary/10 flex items-center justify-center relative z-10 group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-3xl text-primary" data-icon="directions_run">directions_run</span>
</div>
<!-- Decorative Background Element -->
<div class="absolute -bottom-10 -left-10 w-40 h-40 bg-primary/5 rounded-full blur-2xl"></div>
</div>
<div class="hidden md:flex w-24 bg-surface-container-low rounded-lg items-center justify-center flex-col gap-2">
<span class="material-symbols-outlined text-outline" data-icon="history">history</span>
<span class="text-[8px] font-label font-bold uppercase text-outline">Recents</span>
</div>
</div>
</section>
<!-- Action Buttons Section -->
<section class="space-y-4 pt-4">
<button class="w-full bg-ethereal-gradient py-6 rounded-lg text-white font-headline font-black tracking-[0.2em] text-sm shadow-xl hover:opacity-90 active:scale-[0.98] transition-all">
                START SESSION
            </button>
<button class="w-full py-5 rounded-lg border border-outline-variant/20 bg-surface-container-lowest text-on-surface-variant font-label font-bold tracking-widest text-[10px] hover:bg-surface-container-low transition-colors uppercase">
                MANAGE SUBSCRIPTION
            </button>
</section>
</main>
<!-- BottomNavBar Shell -->
</body></html>
